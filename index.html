<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Book a ride across New Providence with RideUp Nassau. See your exact fare before you book, pay by card, and ride with drivers approved by RideUp. Airport rides from LPIA too." />
    <link rel="canonical" href="https://www.rideupnassau.com/" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RideUp Nassau" />
    <meta property="og:title" content="RideUp Nassau — Let’s ride." />
    <meta property="og:description" content="Rides across New Providence with your exact fare shown before you book. Pay by card, track your driver." />
    <meta property="og:url" content="https://www.rideupnassau.com/" />
    <meta property="og:image" content="https://www.rideupnassau.com/og-image.png" />
    <meta property="og:image:alt" content="RideUp Nassau: Let’s ride." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.rideupnassau.com/og-image.png" />
    <meta name="twitter:title" content="RideUp Nassau — Let’s ride." />
    <meta name="twitter:description" content="Rides across New Providence with your exact fare shown before you book. Pay by card, track your driver." />

    <!-- Security -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="theme-color" content="#17603D" />
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <title>RideUp Nassau — Book a ride with upfront prices</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TaxiService",
        "name": "RideUp Nassau",
        "url": "https://www.rideupnassau.com/",
        "image": "https://www.rideupnassau.com/og-image.png",
        "description": "Ride-hailing across New Providence, Bahamas, with the fare shown before you book.",
        "areaServed": { "@type": "Place", "name": "New Providence, The Bahamas" },
        "provider": {
          "@type": "Organization",
          "name": "RideUp Nassau",
          "url": "https://www.rideupnassau.com/",
          "logo": "https://www.rideupnassau.com/icon-512.png",
          "telephone": "+1-242-452-9911",
          "email": "support@rideupnassau.com",
          "sameAs": ["https://instagram.com/rideupnassau"]
        }
      }
    </script>
    <style>
      /* Prevent horizontal scroll */
      html, body { overflow-x: hidden; max-width: 100vw; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
